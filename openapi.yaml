          type: integer
          title: Coach Id
        capacite:
          type: integer
          title: Capacite
        jour_semaine:
          type: integer
          title: Jour Semaine
        heure_debut:
          type: string
          title: Heure Debut
        duree_min:
          type: integer
          title: Duree Min
        periode_debut:
          type: string
          title: Periode Debut
        periode_fin:
          type: string
          title: Periode Fin
        fuseau:
          type: string
          title: Fuseau
      additionalProperties: false
      type: object
      required:
      - type
      - coach_id
      - capacite
      - jour_semaine
      - heure_debut
      - duree_min
      - periode_debut
      - periode_fin
      - fuseau
      title: Cours
    CoursOut:
      properties:
        type:
          type: string
          title: Type
        coach_id:
          type: integer
          title: Coach Id
        capacite:
          type: integer
          title: Capacite
        jour_semaine:
          type: integer
          title: Jour Semaine
        heure_debut:
          type: string
          title: Heure Debut
        duree_min:
          type: integer
          title: Duree Min
        periode_debut:
          type: string
          title: Periode Debut
        periode_fin:
          type: string
          title: Periode Fin
        fuseau:
          type: string
          title: Fuseau
        id:
          type: integer
          title: Id
      additionalProperties: false
      type: object
      required:
      - type
      - coach_id
      - capacite
      - jour_semaine
      - heure_debut
      - duree_min
      - periode_debut
      - periode_fin
      - fuseau
      - id
      title: CoursOut
      description: 'Ce que l''API renvoie pour un cours : les mêmes champs, plus l''id.


        Déclaré pour que la spec OpenAPI décrive la réponse (test de contrat du TP5).'
    CoursPatch:
      properties:
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        coach_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Coach Id
        capacite:
          anyOf:
          - type: integer
          - type: 'null'
          title: Capacite
        jour_semaine:
          anyOf:
          - type: integer
          - type: 'null'
          title: Jour Semaine
        heure_debut:
          anyOf:
          - type: string
          - type: 'null'
          title: Heure Debut
        duree_min:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duree Min
        periode_debut:
          anyOf:
          - type: string
          - type: 'null'
          title: Periode Debut
        periode_fin:
          anyOf:
          - type: string
          - type: 'null'
          title: Periode Fin
        fuseau:
          anyOf:
          - type: string
          - type: 'null'
          title: Fuseau
      additionalProperties: false
      type: object
      title: CoursPatch
    Creneau:
      properties:
        cours_id:
          type: integer
          title: Cours Id
        debut:
          type: string
          title: Debut
        fin:
          type: string
          title: Fin
      additionalProperties: false
      type: object
      required:
      - cours_id
      - debut
      - fin
      title: Creneau
    CreneauPatch:
      properties:
        cours_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Cours Id
        debut:
          anyOf:
          - type: string
          - type: 'null'
          title: Debut
        fin:
          anyOf:
          - type: string
          - type: 'null'
          title: Fin
      additionalProperties: false
      type: object
      title: CreneauPatch
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ReservationIn:
      properties:
        adherent_id:
          type: integer
          title: Adherent Id
      additionalProperties: false
      type: object
      required:
      - adherent_id
      title: ReservationIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: Token de démo fourni dans .env
      scheme: bearer
